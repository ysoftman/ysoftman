name: generate readme assets

on:
  push:
    branches: [ "main" ]
    # workflow 내에서 다음 파일들 push 로 다시 워크플로우가 트리거 되지 않도록 한다.
    paths-ignore:
      - 'github-space-shooter-game.gif'
      - 'github-contribution-grid-snake.svg'
      - 'github-contribution-grid-snake-dark.svg'
      - 'github-readme-stats.svg'
      - 'github-readme-top-langs.svg'
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

# 같은 그룹의 실행은 순차 대기하여 push 충돌 방지 (실행 1개 + 대기 1개, 그 이상은 취소)
concurrency:
  group: commit-to-main
  cancel-in-progress: false

permissions:
  contents: write

# 모든 파일을 한 job 에서 생성하고 마지막에 커밋 1개로 push 한다.
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: generate space shooter gif
        # no-commit 입력은 아직 릴리스 태그(v2.0.5 까지)에 없어서 main 커밋으로 고정한다.
        # 다음 릴리스 태그가 나오면 해당 태그로 바꾼다.
        uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2
        with:
          # secrets.GITHUB_TOKEN 은 job 마다 자동 생성되는 토큰으로 별도 등록이 필요 없다.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'github-space-shooter-game.gif'
          strategy: 'random'
          # 액션 자체 commit/push 를 끄고 아래 단계에서 한 번에 커밋한다.
          no-commit: 'true'

      - name: generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=one_dark_pro
          path: github-readme-stats.svg
          # GitHub API에서 사용자 통계 데이터를 조회하기 위해 필요 (인증 없이는 rate limit 60회/시간)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=one_dark_pro&langs_count=8&card_width=320
          path: github-readme-top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg \
            github-space-shooter-game.gif github-readme-stats.svg github-readme-top-langs.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update readme assets (snake, space shooter, stats)"
            git pull --rebase
            git push
          fi
